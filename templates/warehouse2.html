<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Склад V2 — Управление товарами</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --bg-body: #0f1115;
            --bg-surface: #181b22;
            --border-color: #2d323b;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        .navbar-custom {
            background-color: var(--bg-surface);
            border-bottom: 1px solid var(--border-color);
        }

        .card-custom {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 12px;
        }

        .table-custom {
            color: var(--text-main);
            border-color: var(--border-color);
        }

        .table-custom th {
            background-color: #1f242d;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-color);
            font-weight: 500;
        }

        .table-custom td {
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
        }

        .form-control, .form-select {
            background-color: #0f1115;
            border: 1px solid var(--border-color);
            color: var(--text-main);
        }

        .form-control:focus, .form-select:focus {
            background-color: #0f1115;
            border-color: var(--accent);
            color: var(--text-main);
            box-shadow: 0 0 0 0.25rem rgba(59, 130, 246, 0.25);
        }

        .btn-custom-primary {
            background-color: var(--accent);
            border: none;
            color: #ffffff;
        }

        .btn-custom-primary:hover {
            background-color: #2563eb;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <!-- Навигация -->
    <nav class="navbar navbar-custom px-4 py-3 mb-4">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-3">
                <a href="/" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> На кассу</a>
                <h4 class="m-0 fw-bold">Склад V2</h4>
            </div>
            <div>
                <span class="text-muted small">Управление остатками</span>
            </div>
        </div>
    </nav>

    <!-- Основной контент -->
    <div class="container-fluid px-4">
        
        <!-- Панель управления (Поиск и кнопка добавления) -->
        <div class="row mb-4 g-3">
            <div class="col-md-6">
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0 text-muted" style="border-color: var(--border-color);">
                        <i class="bi bi-search"></i>
                    </span>
                    <input type="text" class="form-control border-start-0" id="searchProduct" placeholder="Поиск товара по названию или артикулу...">
                </div>
            </div>
            <div class="col-md-6 text-md-end">
                <button class="btn btn-custom-primary px-4" data-bs-toggle="modal" data-bs-target="#addProductModal">
                    <i class="bi bi-plus-lg me-1"></i> Добавить товар
                </button>
            </div>
        </div>

        <!-- Таблица товаров -->
        <div class="card card-custom p-0 overflow-hidden">
            <div class="table-responsive">
                <table class="table table-custom m-0 align-middle">
                    <thead>
                        <tr>
                            <th class="ps-4">Наименование</th>
                            <th>Артикул</th>
                            <th>Склад / Ячейка</th>
                            <th>Остаток</th>
                            <th>Цена (₸)</th>
                            <th class="text-end pe-4">Действия</th>
                        </tr>
                    </thead>
                    <tbody id="warehouseTableBody">
                        <!-- Пример строки товара (в дальнейшем будет заменяться на данные из бэкенда/БД) -->
                        <tr>
                            <td class="ps-4 fw-medium">Рукав высокого давления 2SN DN12</td>
                            <td class="text-muted">RVD-2SN-12</td>
                            <td>Склад №1 (Ряд А, Полка 3)</td>
                            <td>
                                <span class="badge bg-success bg-opacity-10 text-success border border-success border-opacity-25 px-2 py-1">45 м</span>
                            </td>
                            <td>2 800 ₸</td>
                            <td class="text-end pe-4">
                                <button class="btn btn-sm btn-outline-secondary me-1" title="Редактировать"><i class="bi bi-pencil"></i></button>
                                <button class="btn btn-sm btn-outline-danger" title="Удалить"><i class="bi bi-trash"></i></button>
                            </td>
                        </tr>
                        <tr>
                            <td class="ps-4 fw-medium">Фитинг DKOL M22x1.5</td>
                            <td class="text-muted">FT-DKOL-22</td>
                            <td>Склад №2 (Коробка 14)</td>
                            <td>
                                <span class="badge bg-warning bg-opacity-10 text-warning border border-warning border-opacity-25 px-2 py-1">120 шт</span>
                            </td>
                            <td>450 ₸</td>
                            <td class="text-end pe-4">
                                <button class="btn btn-sm btn-outline-secondary me-1" title="Редактировать"><i class="bi bi-pencil"></i></button>
                                <button class="btn btn-sm btn-outline-danger" title="Удалить"><i class="bi bi-trash"></i></button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Модальное окно добавления товара (заготовка) -->
    <div class="modal fade" id="addProductModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content" style="background-color: var(--bg-surface); border: 1px solid var(--border-color); color: var(--text-main);">
                <div class="modal-header border-bottom border-secondary border-opacity-25">
                    <h5 class="modal-title">Новый товар на склад</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Закрыть"></button>
                </div>
                <div class="modal-body">
                    <form id="addProductForm">
                        <div class="mb-3">
                            <label class="form-label text-muted small">Наименование товара</label>
                            <input type="text" class="form-control" required placeholder="Например: Адаптер BSP 1/2">
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small">Артикул / Код</label>
                            <input type="text" class="form-control" placeholder="Например: ADP-001">
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label text-muted small">Количество</label>
                                <input type="number" class="form-control" required value="0">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label text-muted small">Цена (₸)</label>
                                <input type="number" class="form-control" required value="0">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small">Расположение (Склад / Ячейка)</label>
                            <input type="text" class="form-control" placeholder="Склад №1, коробка 5">
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-top border-secondary border-opacity-25">
                    <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">Отмена</button>
                    <button type="button" class="btn btn-custom-primary btn-sm">Сохранить товар</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.5org/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
