<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Склад V2 — Управление товарами</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --bg-body: #0f1115;
            --bg-surface: #181b22;
            --border-color: #2d323b;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        .navbar-custom {
            background-color: var(--bg-surface);
            border-bottom: 1px solid var(--border-color);
        }

        .card-custom {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 12px;
        }

        .table-custom {
            color: var(--text-main);
            border-color: var(--border-color);
        }

        .table-custom th {
            background-color: #1f242d;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-color);
            font-weight: 500;
        }

        .table-custom td {
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
        }

        .form-control, .form-select {
            background-color: #0f1115;
            border: 1px solid var(--border-color);
            color: var(--text-main);
        }

        .form-control:focus, .form-select:focus {
            background-color: #0f1115;
            border-color: var(--accent);
            color: var(--text-main);
            box-shadow: 0 0 0 0.25rem rgba(59, 130, 246, 0.25);
        }

        .btn-custom-primary {
            background-color: var(--accent);
            border: none;
            color: #ffffff;
        }

        .btn-custom-primary:hover {
            background-color: #2563eb;
            color: #ffffff;
        }
        
        .location-row {
            background: rgba(255,255,255,0.02);
            border: 1px dashed var(--border-color);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

    <!-- Навигация -->
    <nav class="navbar navbar-custom px-4 py-3 mb-4">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-3">
                <a href="/kassa" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> На кассу</a>
                <!-- Кнопка перехода на страницу детальных остатков -->
                <a href="/detal_ostatki" class="btn btn-outline-warning btn-sm me-2">
                    <i class="bi bi-exclamation-triangle-fill me-1"></i> Детальные остатки (Анализ)
                </a>
                <h4 class="m-0 fw-bold">Склад V2 — Учет товаров и ячеек</h4>
            </div>
            <div>
                <span class="text-muted small">Многоскладской учет</span>
            </div>
        </div>
    </nav>

    <!-- Основной контент -->
    <div class="container-fluid px-4">
        
        <!-- Панель управления -->
        <div class="row mb-4 g-3">
            <div class="col-md-6">
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0 text-muted" style="border-color: var(--border-color);">
                        <i class="bi bi-search"></i>
                    </span>
                    <input type="text" class="form-control border-start-0" id="searchProduct" placeholder="Поиск по наименованию, артикулу или резьбе...">
                </div>
            </div>
            <div class="col-md-6 text-md-end">
                <button class="btn btn-custom-primary px-4" data-bs-toggle="modal" data-bs-target="#addProductModal">
                    <i class="bi bi-plus-lg me-1"></i> Добавить новый товар
                </button>
            </div>
        </div>

        <!-- Таблица товаров -->
        <div class="card card-custom p-0 overflow-hidden">
            <div class="table-responsive">
                <table class="table table-custom m-0 align-middle">
                    <thead>
                        <tr>
                            <th class="ps-4">Наименование / Характеристики</th>
                            <th>Артикул</th>
                            <th>Резьба / Рукав</th>
                            <th>Места хранения и остатки</th>
                            <th>Цены (Опт / Розница)</th>
                            <th class="text-end pe-4">Действия</th>
                        </tr>
                    </thead>
                    <tbody id="warehouseTableBody">
                        <!-- Динамические строки будут загружаться через JS -->
                        <tr>
                            <td colspan="6" class="text-center text-muted py-4">Загрузка данных склада...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Модальное окно редактирования товара V2 -->
    <div class="modal fade" id="editProductModal" tabindex="-1" aria-labelledby="editProductModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content card-custom text-white">
                <div class="modal-header border-bottom border-secondary">
                    <h5 class="modal-title" id="editProductModalLabel"><i class="bi bi-pencil-square text-warning me-2"></i> Редактировать товар</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Закрыть"></button>
                </div>
                <div class="modal-body">
                    <form id="editProductForm">
                        <input type="hidden" id="editProdId">
                        <div class="row g-3">
                            <div class="col-md-8">
                                <label class="form-label small text-muted">Наименование товара *</label>
                                <input type="text" class="form-control form-control-sm bg-dark text-white border-secondary" id="editProdName" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small text-muted">Артикул</label>
                                <input type="text" class="form-control form-control-sm bg-dark text-white border-secondary" id="editProdArticle">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label small text-muted">Резьба</label>
                                <input type="text" class="form-control form-control-sm bg-dark text-white border-secondary" id="editProdThreadName" placeholder="M22x1.5">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label small text-muted">Шаг резьбы</label>
                                <input type="text" class="form-control form-control-sm bg-dark text-white border-secondary" id="editProdThreadPitch">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label small text-muted">Диаметр рукава</label>
                                <input type="text" class="form-control form-control-sm bg-dark text-white border-secondary" id="editProdHoseDia" placeholder="12 мм / 1/2''">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label small text-muted">Угол (°)</label>
                                <input type="number" class="form-control form-control-sm bg-dark text-white border-secondary" id="editProdAngle" value="0">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small text-muted">Оптовая цена (₸)</label>
                                <input type="number" step="0.01" class="form-control form-control-sm bg-dark text-white border-secondary" id="editProdWholesale" value="0">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small text-muted">Розничная цена (₸)</label>
                                <input type="number" step="0.01" class="form-control form-control-sm bg-dark text-white border-secondary" id="editProdRetail" value="0">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small text-muted">Ед. измерения</label>
                                <input type="text" class="form-control form-control-sm bg-dark text-white border-secondary" id="editProdUnit" value="шт">
                            </div>
                            <div class="col-md-12">
                                <label class="form-label small text-muted">Категория</label>
                                <input type="text" class="form-control form-control-sm bg-dark text-white border-secondary" id="editProdCategory">
                            </div>
    
                            <!-- Места хранения при редактировании -->
                            <div class="col-md-12 mt-4">
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <label class="form-label small text-warning mb-0 fw-bold">Места хранения и остатки</label>
                                    <button type="button" class="btn btn-sm btn-outline-info" onclick="addEditLocationRow()"><i class="bi bi-plus"></i> Добавить склад</button>
                                </div>
                                <div id="editLocationsContainer" class="vstack gap-2">
                                    <!-- Строки локаций подгружаются динамически -->
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-top border-secondary">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Отмена</button>
                    <button type="button" class="btn btn-warning btn-sm" onclick="saveEditedProduct()">Сохранить изменения</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Модальное окно добавления товара с расширенными полями -->
    <div class="modal fade" id="addProductModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content" style="background-color: var(--bg-surface); border: 1px solid var(--border-color); color: var(--text-main);">
                <div class="modal-header border-bottom border-secondary border-opacity-25">
                    <h5 class="modal-title fw-bold"><i class="bi bi-box-seam me-2"></i>Добавление товара на склад V2</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Закрыть"></button>
                </div>
                <div class="modal-body">
                    <form id="addProductForm">
                        <!-- Основные данные -->
                        <div class="row g-3 mb-3">
                            <div class="col-md-8">
                                <label class="form-label text-muted small">Наименование товара *</label>
                                <input type="text" class="form-control" id="prodName" required placeholder="Например: Фитинг DKOL / Рукав 2SN">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label text-muted small">Артикул / Код</label>
                                <input type="text" class="form-control" id="prodArticle" placeholder="RVD-12-DKOL">
                            </div>
                        </div>

                        <!-- Характеристики резьбы и рукавов -->
                        <div class="row g-3 mb-3">
                            <div class="col-md-3">
                                <label class="form-label text-muted small">Тип/Название резьбы</label>
                                <input type="text" class="form-control" id="prodThreadName" placeholder="BSP, Metric, JIC">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label text-muted small">Шаг резьбы</label>
                                <input type="text" class="form-control" id="prodThreadPitch" placeholder="1.5, 22x1.5">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label text-muted small">Диаметр рукава</label>
                                <input type="text" class="form-control" id="prodHoseDia" placeholder="DN12, 1/2''">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label text-muted small">Угол (в градусах)</label>
                                <input type="number" class="form-control" id="prodAngle" placeholder="0, 45, 90">
                            </div>
                        </div>

                        <!-- Цены и категории -->
                        <div class="row g-3 mb-3">
                            <div class="col-md-4">
                                <label class="form-label text-muted small">Оптовая цена (₸)</label>
                                <input type="number" step="0.01" class="form-control" id="prodWholesale" value="0">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label text-muted small">Розничная цена (₸)</label>
                                <input type="number" step="0.01" class="form-control" id="prodRetail" value="0">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label text-muted small">Категория</label>
                                <input type="text" class="form-control" id="prodCategory" placeholder="Фитинги, Рукава, Адаптеры">
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-4">
                                <label class="form-label text-muted small">Единица измерения</label>
                                <select class="form-select" id="prodUnit">
                                    <option value="шт">шт (штуки)</option>
                                    <option value="м">м (метры)</option>
                                    <option value="кг">кг (килограммы)</option>
                                    <option value="компл">компл (комплекты)</option>
                                </select>
                            </div>
                        </div>

                        <hr class="border-secondary opacity-25 my-4">

                        <!-- Места хранения и остатки (можно добавлять несколько) -->
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <label class="form-label text-muted small m-0 fw-bold">Места расположения и остатки:</label>
                            <button type="button" class="btn btn-sm btn-outline-primary" onclick="addLocationRow()">
                                <i class="bi bi-plus-circle me-1"></i> Добавить место хранения
                            </button>
                        </div>
                        
                        <div id="locationsContainer">
                            <!-- Первая строка локации по умолчанию -->
                            <div class="location-row row g-2 align-items-center">
                                <div class="col-md-7">
                                    <input type="text" class="form-control form-control-sm loc-name" placeholder="Склад №1 (Ряд А, Коробка 3)" required>
                                </div>
                                <div class="col-md-4">
                                    <input type="number" step="0.01" class="form-control form-control-sm loc-qty" placeholder="Количество" value="0" required>
                                </div>
                                <div class="col-md-1 text-center">
                                    <button type="button" class="btn btn-sm btn-outline-danger" onclick="removeLocationRow(this)" disabled><i class="bi bi-trash"></i></button>
                                </div>
                            </div>
                        </div>

                    </form>
                </div>
                
                <div class="modal-footer border-top border-secondary border-opacity-25">
                    <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">Отмена</button>
                    <button type="button" class="btn btn-custom-primary btn-sm px-4" onclick="saveNewProduct()">Сохранить товар</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let allProductsCache = [];

        
        // Функция добавления новой строчки локации в модальном окне
        function addLocationRow() {
            const container = document.getElementById('locationsContainer');
            const row = document.createElement('div');
            row.className = 'location-row row g-2 align-items-center';
            row.innerHTML = `...`;
            container.appendChild(row);
        }

        function removeLocationRow(btn) {
            const row = btn.closest('.location-row');
            if (document.querySelectorAll('.location-row').length > 1) {
                row.remove();
            }
        }

        // ==========================================
        // 1. ВСТАВЬТЕ В ЭТО МЕСТО ФУНКЦИЮ СОХРАНЕНИЯ:
        // ==========================================
        function saveNewProduct() {
            const name = document.getElementById('prodName').value;
            if (!name) {
                alert('Введите наименование товара!');
                return;
            }

            // Собираем массив локаций
            const locations = [];
            document.querySelectorAll('.location-row').forEach(row => {
                const locName = row.querySelector('.loc-name').value;
                const locQty = row.querySelector('.loc-qty').value;
                if (locName) {
                    locations.push({ location_name: locName, quantity: parseFloat(locQty) || 0 });
                }
            });

            const productData = {
                name: name,
                article: document.getElementById('prodArticle').value,
                thread_name: document.getElementById('prodThreadName').value,
                thread_pitch: document.getElementById('prodThreadPitch').value,
                hose_diameter: document.getElementById('prodHoseDia').value,
                angle_degrees: parseInt(document.getElementById('prodAngle').value) || 0,
                wholesale_price: parseFloat(document.getElementById('prodWholesale').value) || 0,
                retail_price: parseFloat(document.getElementById('prodRetail').value) || 0,
                category: document.getElementById('prodCategory').value,
                unit: document.getElementById('prodUnit').value,
                locations: locations
            };

            // Отправляем данные на сервер
            fetch('/api/warehouse/v2/add', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(productData)
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert('Товар успешно сохранен в базе данных!');
                    const modalEl = document.getElementById('addProductModal');
                    const modal = bootstrap.Modal.getInstance(modalEl);
                    modal.hide();
                    document.getElementById('addProductForm').reset();
                    
                    // Сбрасываем локации до одной строки
                    document.getElementById('locationsContainer').innerHTML = `
                        <div class="location-row row g-2 align-items-center">
                            <div class="col-md-7">
                                <input type="text" class="form-control form-control-sm loc-name" placeholder="Склад №1 (Ряд А, Коробка 3)" required>
                            </div>
                            <div class="col-md-4">
                                <input type="number" step="0.01" class="form-control form-control-sm loc-qty" placeholder="Количество" value="0" required>
                            </div>
                            <div class="col-md-1 text-center">
                                <button type="button" class="btn btn-sm btn-outline-danger" onclick="removeLocationRow(this)" disabled><i class="bi bi-trash"></i></button>
                            </div>
                        </div>
                    `;
                    
                    // А ТАКЖЕ ВЫЗЫВАЕМ ПЕРЕЗАГРУЗКУ ТАБЛИЦЫ, ЧТОБЫ ТОВАР СРАЗУ ПОЯВИЛСЯ НА ЭКРАНЕ:
                    loadWarehouseProducts();

                } else {
                    alert('Ошибка при сохранении: ' + (data.error || 'Неизвестная ошибка'));
                }
            })
            .catch(error => {
                console.error('Ошибка сети:', error);
                let message = error && error.message ? error.message : String(error);
                alert('Произошла ошибка связи с сервером: ' + message);
            });
        }

        // ==========================================
        // 2. И СРАЗУ ПОД НЕЙ ДОБАВЬТЕ ФУНКЦИЮ ЗАГРУЗКИ:
        // ==========================================
        function loadWarehouseProducts() {
            fetch('/api/warehouse/v2/products')
                .then(response => response.json())
                .then(products => {
                    allProductsCache = products; // Сохраняем в кэш
                    const tbody = document.getElementById('warehouseTableBody');
                    tbody.innerHTML = '';

                    if (!products || products.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted py-4">Склад пуст. Добавьте первый товар!</td></tr>`;
                        return;
                    }

                    products.forEach(prod => {
                        let specs = [];
                        if (prod.thread_name) specs.push(`Резьба: ${prod.thread_name}`);
                        if (prod.thread_pitch) specs.push(`Шаг: ${prod.thread_pitch}`);
                        if (prod.hose_diameter) specs.push(`Рукав: ${prod.hose_diameter}`);
                        if (prod.angle_degrees) specs.push(`Угол: ${prod.angle_degrees}°`);
                        const specsText = specs.join(' | ');

                        let locationsHtml = '';
                        if (prod.locations && prod.locations.length > 0) {
                            locationsHtml = prod.locations.map(loc => 
                                `<div class="small text-muted"><i class="bi bi-geo-alt me-1 text-primary"></i>${loc.location}: <strong class="text-white">${loc.qty} ${prod.unit}</strong></div>`
                            ).join('');
                        } else {
                            locationsHtml = '<span class="text-muted small">Места не указаны</span>';
                        }

                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td class="ps-4">
                                <div class="fw-bold">${prod.name}</div>
                                <div class="small text-muted">${specsText}</div>
                                ${prod.category ? `<span class="badge bg-secondary bg-opacity-25 text-info mt-1">${prod.category}</span>` : ''}
                            </td>
                            <td><code class="text-warning">${prod.article || '—'}</code></td>
                            <td>
                                <div class="small">${prod.thread_name || '—'}</div>
                                <div class="text-muted small">${prod.hose_diameter ? 'Ду: ' + prod.hose_diameter : ''}</div>
                            </td>
                            <td>${locationsHtml}</td>
                            <td>
                                <div class="small text-success">Опт: ${prod.wholesale_price} ₸</div>
                                <div class="small text-info">Розн: ${prod.retail_price} ₸</div>
                            </td>
                            <td class="text-end pe-4">
                                <button class="btn btn-sm btn-outline-warning" onclick="openEditModal(${prod.id})" title="Редактировать товар"><i class="bi bi-pencil"></i></button>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
                })
                .catch(error => {
                    console.error('Ошибка загрузки товаров:', error);
                    document.getElementById('warehouseTableBody').innerHTML = `<tr><td colspan="6" class="text-center text-danger py-4">Ошибка загрузки данных с сервера</td></tr>`;
                });
        }

        // Открытие модального окна и заполнение данными выбранного товара
        function openEditModal(productId) {
            const prod = allProductsCache.find(p => p.id === productId);
            if (!prod) return;

            document.getElementById('editProdId').value = prod.id;
            document.getElementById('editProdName').value = prod.name || '';
            document.getElementById('editProdArticle').value = prod.article || '';
            document.getElementById('editProdThreadName').value = prod.thread_name || '';
            document.getElementById('editProdThreadPitch').value = prod.thread_pitch || '';
            document.getElementById('editProdHoseDia').value = prod.hose_diameter || '';
            document.getElementById('editProdAngle').value = prod.angle_degrees || 0;
            document.getElementById('editProdWholesale').value = prod.wholesale_price || 0;
            document.getElementById('editProdRetail').value = prod.retail_price || 0;
            document.getElementById('editProdUnit').value = prod.unit || 'шт';
            document.getElementById('editProdCategory').value = prod.category || '';

            // Заполняем локации
            const container = document.getElementById('editLocationsContainer');
            container.innerHTML = '';

            if (prod.locations && prod.locations.length > 0) {
                prod.locations.forEach(loc => {
                    appendEditLocationRow(loc.location, loc.qty);
                });
            } else {
                appendEditLocationRow('', 0);
            }

            // Показываем модальное окно
            const modal = new bootstrap.Modal(document.getElementById('editProductModal'));
            modal.show();
        }

        function appendEditLocationRow(locationName = '', quantity = 0) {
            const container = document.getElementById('editLocationsContainer');
            const row = document.createElement('div');
            row.className = 'location-row row g-2 align-items-center';
            row.innerHTML = `
                <div class="col-md-7">
                    <input type="text" class="form-control form-control-sm bg-dark text-white border-secondary loc-name" value="${locationName}" placeholder="Склад / Ячейка" required>
                </div>
                <div class="col-md-4">
                    <input type="number" step="0.01" class="form-control form-control-sm bg-dark text-white border-secondary loc-qty" value="${quantity}" placeholder="Количество" required>
                </div>
                <div class="col-md-1 text-center">
                    <button type="button" class="btn btn-sm btn-outline-danger" onclick="removeLocationRow(this)"><i class="bi bi-trash"></i></button>
                </div>
            `;
            container.appendChild(row);
        }

        function addEditLocationRow() {
            appendEditLocationRow('', 0);
        }

        // Сохранение отредактированного товара
        function saveEditedProduct() {
            const productId = document.getElementById('editProdId').value;
            const name = document.getElementById('editProdName').value;
            if (!name) {
                alert('Наименование товара обязательно!');
                return;
            }

            // Собираем локации
            const locations = [];
            document.querySelectorAll('#editLocationsContainer .location-row').forEach(row => {
                const locName = row.querySelector('.loc-name').value;
                const locQty = row.querySelector('.loc-qty').value;
                if (locName) {
                    locations.push({ location_name: locName, quantity: parseFloat(locQty) || 0 });
                }
            });

            const productData = {
                name: name,
                article: document.getElementById('editProdArticle').value,
                thread_name: document.getElementById('editProdThreadName').value,
                thread_pitch: document.getElementById('editProdThreadPitch').value,
                hose_diameter: document.getElementById('editProdHoseDia').value,
                angle_degrees: parseInt(document.getElementById('editProdAngle').value) || 0,
                wholesale_price: parseFloat(document.getElementById('editProdWholesale').value) || 0,
                retail_price: parseFloat(document.getElementById('editProdRetail').value) || 0,
                category: document.getElementById('editProdCategory').value,
                unit: document.getElementById('editProdUnit').value,
                locations: locations
            };

            fetch(`/api/warehouse/v2/update/${productId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(productData)
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert('Товар успешно обновлен!');
                    const modalEl = document.getElementById('editProductModal');
                    const modal = bootstrap.Modal.getInstance(modalEl);
                    modal.hide();
                    loadWarehouseProducts(); // Перезагружаем таблицу
                } else {
                    alert('Ошибка при обновлении: ' + (data.error || 'Неизвестная ошибка'));
                }
            })
            .catch(error => {
                console.error('Ошибка сети:', error);
                alert('Произошла ошибка связи с сервером');
            });
        }

        // Запускаем загрузку товаров при открытии страницы
        document.addEventListener('DOMContentLoaded', loadWarehouseProducts);
    </script>
</body>
</html>
